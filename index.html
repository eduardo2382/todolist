<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo List</title>
    <link rel="stylesheet" href="src/styles/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet"/>
</head>
<body>
    <header>
        <h1>Tarefas</h1>
    </header>
    <main>
        <section class="addTodoContainer">
            <h2>Nova Tarefa</h2>
            <span id="inputsTodo">
                <input type="text" placeholder="Oque você precisa fazer" name="" id="inptNewTodo">
                <input type="button" value="Adicionar" id="btnAddTodo">
            </span>
        </section>
        <section class="listTodoContainer">
            <h2>Minhas Tarefas</h2>
            <div id="listTodo">
                <div class="todoContainer">
                    <span class="todo">
                        <i class="ri-checkbox-blank-circle-line btnCheckTodo"></i>
                        <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Et optio vel eveniet repudiandae eaque sed veritatis minima sunt alias atque ipsum labore blanditiis cupiditate, dignissimos voluptatibus quod quas minus quos.</p>
                    </span>
                    <i class="ri-delete-bin-7-line btnDeleteTodo"></i>
                </div>
                <div class="todoContainer todoChecked">
                    <span class="todo">
                        <i class="ri-checkbox-circle-fill "></i>
                        <p>Nome da Tarefa</p>
                    </span>
                    <i class="ri-delete-bin-7-line btnDeleteTodo"></i>
                </div>
            </div>
        </section>
    </main>

    <script src="src/scripts/script.js"></script>
</body>
</html>
